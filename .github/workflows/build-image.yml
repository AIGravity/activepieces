# Gravity image build
#
# Builds the AP container image from our fork and pushes to ECR. Triggered
# by pushes to gravity/main and by gravity-v* tags. The DevOps team owns
# the AWS-side bits (ECR repo, IAM OIDC role, secrets). See
# core/docs/ACTIVEPIECES_FORK_AND_DEPLOY.md § Production deployment.
#
# Required repository secrets:
#   AWS_DEPLOY_ROLE_ARN  — IAM role with OIDC trust + ECR push perms
#   ECR_REGISTRY         — e.g. <acct>.dkr.ecr.us-east-1.amazonaws.com
#
# Image tags produced:
#   :<git-sha>           — every build
#   :latest              — only on gravity/main pushes
#   :v<X.Y.Z>            — only on gravity-vX.Y.Z tags

name: gravity / build-image

on:
  push:
    branches:
      - 'gravity/main'
    tags:
      - 'gravity-v*'

permissions:
  id-token: write  # OIDC for AWS auth
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Compute tag list
        id: tags
        run: |
          set -euo pipefail
          BASE="${{ secrets.ECR_REGISTRY }}/gravity-ap"
          TAGS="${BASE}:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/gravity/main" ]; then
            TAGS="${TAGS},${BASE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/gravity-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/gravity-}"
            TAGS="${TAGS},${BASE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "Will tag: ${TAGS}"

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
